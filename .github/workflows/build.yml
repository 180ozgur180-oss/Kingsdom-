name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Proje dosyalarini olustur
        run: |
            cat > settings.gradle <<'EOF'
            pluginManagement {
                repositories {
                    google()
                    mavenCentral()
                    gradlePluginPortal()
                }
            }
            dependencyResolutionManagement {
                repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                repositories {
                    google()
                    mavenCentral()
                }
            }
            rootProject.name = 'kingdoms'
            include ':app'
            EOF
            cat > build.gradle <<'EOF'
            plugins {
                id 'com.android.application' version '8.5.2' apply false
            }
            EOF
            cat > gradle.properties <<'EOF'
            org.gradle.jvmargs=-Xmx3g
            android.useAndroidX=false
            EOF
            mkdir -p app
            cat > app/build.gradle <<'EOF'
            plugins {
                id 'com.android.application'
            }

            android {
                namespace 'com.kingdoms.game'
                compileSdk 34

                defaultConfig {
                    applicationId 'com.kingdoms.game'
                    minSdk 21
                    targetSdk 34
                    versionCode 1
                    versionName '1.0'
                }

                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_1_8
                    targetCompatibility JavaVersion.VERSION_1_8
                }

                sourceSets {
                    main {
                        jniLibs.srcDirs = ['libs']
                    }
                }
            }

            configurations {
                natives
            }

            def gdxVersion = '1.12.1'

            dependencies {
                implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
                implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
                natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
                natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
                natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
                natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
            }

            tasks.register('copyAndroidNatives') {
                doFirst {
                    configurations.natives.files.each { jar ->
                        def abi = null
                        if (jar.name.endsWith('natives-armeabi-v7a.jar')) abi = 'armeabi-v7a'
                        else if (jar.name.endsWith('natives-arm64-v8a.jar')) abi = 'arm64-v8a'
                        else if (jar.name.endsWith('natives-x86_64.jar')) abi = 'x86_64'
                        else if (jar.name.endsWith('natives-x86.jar')) abi = 'x86'
                        if (abi != null) {
                            def outDir = file("libs/$abi")
                            outDir.mkdirs()
                            copy {
                                from zipTree(jar)
                                into outDir
                                include '*.so'
                            }
                        }
                    }
                }
            }

            tasks.configureEach { task ->
                if (task.name.contains('JniLibFolders')) {
                    task.dependsOn 'copyAndroidNatives'
                }
            }
            EOF
            mkdir -p app/src/main
            cat > app/src/main/AndroidManifest.xml <<'EOF'
            <?xml version="1.0" encoding="utf-8"?>
            <manifest xmlns:android="http://schemas.android.com/apk/res/android">

                <uses-feature android:glEsVersion="0x00020000" android:required="true" />

                <application
                    android:allowBackup="true"
                    android:label="Kingdoms"
                    android:theme="@android:style/Theme.NoTitleBar.Fullscreen">

                    <activity
                        android:name=".AndroidLauncher"
                        android:exported="true"
                        android:screenOrientation="sensorLandscape"
                        android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize|screenLayout">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.LAUNCHER" />
                        </intent-filter>
                    </activity>
                </application>
            </manifest>
            EOF
            mkdir -p app/src/main/java/com/kingdoms/game
            cp MainGame.java app/src/main/java/com/kingdoms/game/MainGame.java
            mkdir -p app/src/main/java/com/kingdoms/game
            cat > app/src/main/java/com/kingdoms/game/AndroidLauncher.java <<'EOF'
            package com.kingdoms.game;

            import android.os.Bundle;

            import com.badlogic.gdx.backends.android.AndroidApplication;
            import com.badlogic.gdx.backends.android.AndroidApplicationConfiguration;

            public class AndroidLauncher extends AndroidApplication {

                @Override
                protected void onCreate(Bundle savedInstanceState) {
                    super.onCreate(savedInstanceState);

                    AndroidApplicationConfiguration config = new AndroidApplicationConfiguration();
                    config.useImmersiveMode = true;
                    config.numSamples = 2;

                    initialize(new MainGame(), config);
                }
            }
            EOF

      - name: APK derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: kingdoms-apk
          path: app/build/outputs/apk/debug/app-debug.apk
